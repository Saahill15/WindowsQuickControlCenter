name: Windows CI

on:
  pull_request:
  push:

jobs:
  windows-test-build:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Compile Python sources
        run: .\.venv\Scripts\python.exe -m compileall -q main.py quickcontrol scripts tests

      - name: Install Inno Setup 6
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build application and installer
        run: .\Build-Windows.bat

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quick-control-center-windows-${{ github.sha }}
          path: |
            dist/QuickControlCenter/**
            installer/output/QuickControlCenter-Setup-*.exe
          if-no-files-found: error
          retention-days: 14